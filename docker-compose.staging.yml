services:
  postgres:
    image: postgres:18-alpine
    container_name: undercoverinfinite-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applique les migrations Prisma avant que l'API ne démarre, à chaque
  # déploiement. Conteneur éphémère (même image que l'API) : `migrate deploy`
  # est idempotent et ne rejoue que les migrations manquantes.
  migrate:
    image: ${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}
    container_name: undercoverinfinite-staging-migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db

  api:
    image: ${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}
    container_name: undercoverinfinite-staging-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-google/gemini-3.5-flash-lite}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-https://ai-gateway.vercel.sh/v1/chat/completions}
      # L'auth par cookies interdit `Access-Control-Allow-Origin: *` : la liste
      # des origines autorisées doit être explicite, sinon le front n'obtient
      # plus rien de l'API (y compris le tirage des mots).
      CORS_ORIGINS: https://staging.undercoverinfinite.com
      # Sans ce secret, l'API refuse de démarrer (NODE_ENV=production).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      # Front et API partagent le domaine enregistrable undercoverinfinite.com :
      # SameSite=Strict (défaut) fonctionne, et NODE_ENV=production impose déjà
      # le flag Secure.
      AUTH_API_URL: https://api-staging.undercoverinfinite.com
      AUTH_OAUTH_SUCCESS_REDIRECT: https://staging.undercoverinfinite.com
      # Un échec OAuth revient sur l'écran de connexion, avec ?error=…
      AUTH_OAUTH_FAILURE_REDIRECT: https://staging.undercoverinfinite.com/connexion
      # Vides = /auth/google et /auth/facebook répondent 503, le reste tourne.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      # L'API ne démarre pas si les migrations ont échoué.
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - db
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.undercoverinfinite-staging-api.rule=Host(`api-staging.undercoverinfinite.com`)
      - traefik.http.routers.undercoverinfinite-staging-api.entrypoints=websecure
      - traefik.http.routers.undercoverinfinite-staging-api.tls=true
      - traefik.http.routers.undercoverinfinite-staging-api.tls.certresolver=le
      - traefik.http.services.undercoverinfinite-staging-api.loadbalancer.server.port=3000

  app:
    image: ${CI_REGISTRY_IMAGE}/app:${IMAGE_TAG}
    container_name: undercoverinfinite-staging-app
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: https://api-staging.undercoverinfinite.com
    volumes:
      - ./audio/music.mp3:/app/.output/public/audio/music.mp3:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.undercoverinfinite-staging-app.rule=Host(`staging.undercoverinfinite.com`)
      - traefik.http.routers.undercoverinfinite-staging-app.entrypoints=websecure
      - traefik.http.routers.undercoverinfinite-staging-app.tls=true
      - traefik.http.routers.undercoverinfinite-staging-app.tls.certresolver=le
      - traefik.http.services.undercoverinfinite-staging-app.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
  db:

volumes:
  postgres_data:
