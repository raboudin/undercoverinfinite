name: CI

# Le dépôt est un monorepo "par convention" : deux projets Node indépendants,
# `frontend/` (Nuxt 4) et `api/` (NestJS + Prisma), sans outillage de workspace
# et sans package.json à la racine. Chaque job fait donc son propre `npm ci`
# dans son sous-dossier — il n'y a rien à installer au niveau racine.
#
# Les jobs de packaging Docker et de déploiement ont été retirés : ils
# supposaient des Dockerfiles (`docker/Dockerfile`, `docker/Dockerfile.api`) et
# des compose files (`docker-compose.staging.yml`, `docker-compose.prod.yml`)
# qui n'existent pas dans ce dépôt. À réintroduire le jour où l'hébergement
# sera réellement en place (voir deploy.yml / rollback.yml, dormants).

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # BUILD — uniquement sur les pull requests (= branches de feature GitLab)
  #
  # frontend/ et api/ sont deux projets Node indépendants (pas de
  # package.json à la racine du repo) : chaque step tourne dans son propre
  # dossier via une matrice, plutôt qu'un seul `npm ci`/`npm run build` à
  # la racine qui n'a jamais eu de package.json à consommer.
  #
  # Pas d'artifact node_modules entre build et unit-tests : le zip
  # d'actions/upload-artifact casse les symlinks de node_modules/.bin/
  # (vitest, jest introuvables au download). Chaque job refait son
  # `npm ci`, avec le cache npm natif de setup-node pour rester rapide.
  # ---------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - working-directory: ${{ matrix.app }}
        run: npm ci
      - working-directory: ${{ matrix.app }}
        run: npm run build

  # ---------------------------------------------------------------------
  # TESTS — `npm test` de chaque projet (vitest côté frontend, jest côté
  # api), dans son propre dossier.
  # ---------------------------------------------------------------------
  unit-tests:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - working-directory: ${{ matrix.app }}
        run: npm ci
      - working-directory: ${{ matrix.app }}
        run: npm test

  # e2e-tests : désactivé pour l'instant, aucun e2e n'est encore écrit/branché
  # côté frontend (pas de Playwright installé) ni câblé correctement côté
  # api (son vrai e2e Jest existe dans api/test/app.e2e-spec.ts mais n'est
  # pas ce que ce job lançait). À réactiver une fois les e2e réellement en
  # place, avec working-directory par appli comme les autres jobs.
  # e2e-tests:
  #   needs: build
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   container:
  #     image: mcr.microsoft.com/playwright:v1.61.1-noble
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: npm ci
  #     - run: npm run build
  #     - run: npm run test:e2e
  #     - uses: actions/upload-artifact@v7
  #       if: always()
  #       with:
  #         name: playwright-report
  #         path: playwright-report/
  #         retention-days: 7

  # coverage : désactivé pour l'instant, même souci que e2e-tests — tourne
  # à la racine (pas de package.json) et appelle `npm run test:coverage`,
  # qui n'existe dans aucun des deux package.json (frontend/api). À
  # réactiver en matrice frontend/api (vitest --coverage / jest --coverage)
  # une fois les scripts npm correspondants ajoutés.
  # coverage:
  #   needs: build
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres:
  #       image: postgres:18-alpine
  #       env:
  #         POSTGRES_USER: undercoverinfinite
  #         POSTGRES_PASSWORD: undercoverinfinite
  #         POSTGRES_DB: undercoverinfinite_test
  #       ports:
  #         - 5432:5432
  #       options: >-
  #         --health-cmd "pg_isready -U undercoverinfinite -d undercoverinfinite_test"
  #         --health-interval 5s
  #         --health-timeout 5s
  #         --health-retries 10
  #   env:
  #     DATABASE_URL: postgresql://undercoverinfinite:undercoverinfinite@localhost:5432/undercoverinfinite_test?schema=public
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #     - run: npm ci
  #     - run: npm run test:coverage
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: coverage-report
  #         path: coverage/cobertura-coverage.xml
  #     # Pour publier la couverture en commentaire de PR (équivalent du "coverage:"
  #     # GitLab qui parse le pourcentage), on peut ajouter par exemple :
  #     # - uses: irongut/CodeCoverageSummary@v1.3.0
  #     #   with:
  #     #     filename: coverage/cobertura-coverage.xml

  # ---------------------------------------------------------------------
  # SCAN — dépendances vulnérables, secrets committés, mauvaises configs.
  # Échoue uniquement sur les failles CRITICAL disposant d'un correctif,
  # pour éviter le bruit des CVE non corrigeables.
  # ---------------------------------------------------------------------
  trivy-scan-repo:
    needs: [unit-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan du dépôt (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  # ---------------------------------------------------------------------
  # PACKAGE — build & push des images Docker, uniquement sur main.
  #
  # Les tags vX.Y.Z ne rebuild PAS : comme un tag est toujours créé sur un
  # commit déjà présent sur main, l'image existe déjà (taguée avec le SHA
  # du commit). Le tag se contente de "retag" cette image existante
  # (voir jobs retag-*-image) — ça évite un build Docker redondant.
  #
  # Registre utilisé ici : GitHub Container Registry (ghcr.io). Remplacer
  # par un autre registre si besoin.
  # ---------------------------------------------------------------------
  build-push-app-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ github.sha }}
            ghcr.io/${{ github.repository }}/app:latest

  build-push-api-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest

  # Sur un tag vX.Y.Z : récupère l'image déjà buildée pour ce commit (taguée
  # avec le SHA) et la re-tague/pousse sous le tag de version, sans repasser
  # par "docker build".
  retag-app-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker pull ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}/app:${{ github.sha }} ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/app:${{ github.ref_name }}

  retag-api-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker pull ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository }}/api:${{ github.sha }} ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}

  # ---------------------------------------------------------------------
  # DEPLOY — appelle le workflow réutilisable deploy.yml
  # (équivalent du template GitLab .deploy-vps)
  # ---------------------------------------------------------------------

  # À chaque push sur main : déploie le dernier commit de main sur staging
  deploy-staging:
    needs: [build-push-app-image, build-push-api-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      compose_file: docker-compose.staging.yml
      deploy_subpath: staging
      image_tag: ${{ github.sha }}
    secrets: inherit

  # À chaque tag vX.Y.Z : déploie cette version précise sur production
  deploy-production:
    needs: [retag-app-image, retag-api-image]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      compose_file: docker-compose.prod.yml
      deploy_subpath: production
      image_tag: ${{ github.ref_name }}
    secrets: inherit
